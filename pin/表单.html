<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    form {
        font-size: 14px;
        text-align: center;
        list-style: none;
    }

    table {
        margin: auto;

    }

    table tr {
        text-align: right;
        line-height: normal;
    }

    table tr td {
        color: #5b5959;
        font-size: 14px;
        text-align: center;
    }

    input {
        margin-bottom: 20px;
    }

    input[type="submit"] {
        width: 150px;
        height: 30px;
        color: white;
        background-color: red;
        text-align: center;
        line-height: 30px;
    }
</style>

<body>
    <form name="'注册新用户" method="post">
        <table>
            <tr>
                <td>手机号码：</td>
                <td><input type="tel" maxlength="11"></td>
            </tr>
            <tr>
                <td>短信验证码：</td>
                <td><input type="number">
                </td>
            </tr>
            <tr>
                <td>登陆密码：</td>
                <td><input type="password">
                </td>
            </tr>
            <tr>
                <td>确认密码：</td>
                <td><input type="passwords">
                </td>
            </tr>
        </table>
        <input type="checkbox" checked="checked">同意协议并注册<a href="#" style="text-decoration: none;">《用户协议》</a><br>
        <input type="submit" value="完成注册">
    </form>
</body>

</html>
